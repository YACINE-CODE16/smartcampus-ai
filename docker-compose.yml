# Base PostgreSQL de développement (en production : Amazon RDS).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: smartcampus
      POSTGRES_DB: smartcampus
    ports:
      - "55432:5432"  # port hôte 55432 pour ne pas gêner un PostgreSQL local existant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcampus"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
